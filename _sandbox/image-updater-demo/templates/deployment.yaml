apiVersion: apps/v1
kind: Deployment
metadata:
    name: podinfo
spec:
    replicas: 1
    selector:
        matchLabels:
            app: podinfo
    template:
        metadata:
            labels:
                app: podinfo
        spec:
            securityContext:
                runAsNonRoot: true
                runAsUser: 100
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: podinfo
                  image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
                  command: [./podinfo, --port=9898, --level=info]
                  ports:
                      - name: http
                        containerPort: 9898
                  readinessProbe:
                      httpGet:
                          path: /readyz
                          port: http
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop: [ALL]
                  resources:
                      requests:
                          cpu: 5m
                          memory: 16Mi
                      limits:
                          memory: 64Mi
