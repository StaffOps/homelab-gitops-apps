# Exposure: https://rollout-demo.<domain> through the shared Gateway (external-dns creates the record, the wildcard
# certificate covers TLS). Delete this file if the app is internal only.
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
      name: rollout-demo
  spec:
      parentRefs:
          - name: {{ .Values.gateway.name }}
            namespace: {{ .Values.gateway.namespace }}
            sectionName: https
      hostnames:
          - rollout-demo.{{ .Values.domain }}
      rules:
          - backendRefs:
                - name: rollout-demo
                  port: 80
