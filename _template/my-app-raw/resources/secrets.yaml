# Secrets of this app: Vault secret/homelab/apps/<namespace>/<name>, read through this namespace's own SecretStore
# (Vault role "apps": only ServiceAccount vault-reader of a namespace labelled staffops.space/tier=apps, and only
# its own path). The platform's ClusterSecretStore vault refuses app namespaces. Write a value with
#   vault kv put secret/homelab/apps/my-app/<name> <key>=<value>     (operator, see homelab-gitops docs/runbooks/vault.md)
# Delete the ExternalSecret below if the app has no secrets (keep it as a reference otherwise).
- apiVersion: v1
  kind: ServiceAccount
  metadata:
      name: vault-reader
- apiVersion: external-secrets.io/v1
  kind: SecretStore
  metadata:
      name: vault
  spec:
      provider:
          vault:
              server: http://vault.vault.svc:8200
              path: secret
              version: v2
              auth:
                  kubernetes:
                      mountPath: kubernetes
                      role: apps
                      serviceAccountRef:
                          name: vault-reader
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: my-app
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: SecretStore
          name: vault
      target:
          name: my-app
      dataFrom:
          - extract:
                key: homelab/apps/my-app/my-app
