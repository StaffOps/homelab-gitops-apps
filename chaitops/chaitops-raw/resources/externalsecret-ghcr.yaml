# Secret ghcr (dockerconfigjson): pull credential of the private images ghcr.io/staffops/chaitops/*. Vault
# secret/homelab/apps/chaitops/ghcr, keys username + token (GitHub login + classic PAT with only read:packages).
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: ghcr
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: SecretStore
          name: vault
      target:
          name: ghcr
          creationPolicy: Owner
          template:
              type: kubernetes.io/dockerconfigjson
              engineVersion: v2
              data:
                  .dockerconfigjson: '{{`{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}`}}'
      dataFrom:
          - extract:
                key: homelab/apps/chaitops/ghcr
