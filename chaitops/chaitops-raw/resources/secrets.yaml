# Secrets of this namespace: Vault secret/homelab/apps/chaitops/<name> (the same paths vps/chaitops reads), through this
# namespace's own SecretStore (Vault role apps: only ServiceAccount vault-reader of a namespace labelled
# staffops.space/tier=apps, only its own path). Values are written by the operator, never in git.
- apiVersion: v1
  kind: ServiceAccount
  metadata:
      name: vault-reader
- apiVersion: external-secrets.io/v1
  kind: SecretStore
  metadata:
      name: vault
  spec:
      provider:
          vault:
              server: http://vault.vault.svc:8200
              path: secret
              version: v2
              auth:
                  kubernetes:
                      mountPath: kubernetes
                      role: apps
                      serviceAccountRef:
                          name: vault-reader
