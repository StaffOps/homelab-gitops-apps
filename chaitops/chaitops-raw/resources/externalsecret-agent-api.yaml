# Secret agent-api: every key of Vault secret/homelab/apps/chaitops/agent-api (written by the operator, never in git).
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: agent-api
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: SecretStore
          name: vault
      target:
          name: agent-api
          creationPolicy: Owner
      dataFrom:
          - extract:
                key: homelab/apps/chaitops/agent-api
