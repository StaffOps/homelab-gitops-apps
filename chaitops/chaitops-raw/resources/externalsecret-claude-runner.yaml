# Secret claude-runner: every key of Vault secret/homelab/apps/chaitops/claude-runner (written by the operator, never in git).
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: claude-runner
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: SecretStore
          name: vault
      target:
          name: claude-runner
          creationPolicy: Owner
      dataFrom:
          - extract:
                key: homelab/apps/chaitops/claude-runner
