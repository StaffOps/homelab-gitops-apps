# Authelia's users database (argon2 hashes): Vault secret/homelab/apps/edge/authelia-users, key users_database.yml,
# mounted read-only at /etc/authelia/users. Authelia reads the file at startup: restart it after a change.
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: authelia-users
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: SecretStore
          name: vault
      target:
          name: authelia-users
      dataFrom:
          - extract:
                key: homelab/apps/edge/authelia-users
