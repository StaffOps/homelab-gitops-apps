# Authelia's env secrets: Vault secret/homelab/apps/edge/authelia (AUTHELIA_SESSION_SECRET,
# AUTHELIA_STORAGE_ENCRYPTION_KEY, AUTHELIA_JWT_SECRET → env AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET).
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: authelia
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: SecretStore
          name: vault
      target:
          name: authelia
      dataFrom:
          - extract:
                key: homelab/apps/edge/authelia
