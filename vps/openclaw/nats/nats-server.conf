# NATS JetStream: durable task queue of OpenClaw. No secrets here: the bcrypt hashes come from secrets.conf
# (Secret nats-auth, Vault homelab/apps/openclaw/nats-auth, mounted next to this file in /etc/nats).
# Source: PersonalAIgent/personal-assistant infra/openclaw/nats/nats-server.conf; on k3s the monitoring
# port listens on loopback only (the exporter sidecar and the exec probe read it there).
server_name: vps-tasks
listen: 0.0.0.0:4222
# Monitoring (no auth): loopback only, read by the exporter sidecar in the same pod.
http: 127.0.0.1:8222

jetstream {
  store_dir: /data
  max_memory_store: 64M
  max_file_store: 1G
  # Nó único: fsync a cada escrita (volume baixo; não perder tarefa em queda de energia).
  sync_interval: always
}

include ./secrets.conf

# Autoridade pela CREDENCIAL, nunca pelo conteúdo: cada origem só publica na sua faixa.
authorization {
  users: [
    { user: admin, password: $ADMIN_HASH }
    {
      user: owner, password: $OWNER_HASH
      permissions: {
        publish: ["tasks.p0", "$JS.API.STREAM.INFO.TASKS"]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      user: hermes, password: $HERMES_HASH
      permissions: {
        publish: {
          allow: ["tasks.p1", "$JS.API.STREAM.INFO.*", "$JS.API.CONSUMER.INFO.RESULTS.HERMES",
                  "$JS.API.CONSUMER.MSG.NEXT.RESULTS.HERMES", "$JS.ACK.RESULTS.HERMES.>"]
          deny: ["tasks.p0", "tasks.p2"]
        }
        subscribe: ["_INBOX.>"]
      }
    }
    {
      user: openclaw, password: $OPENCLAW_HASH
      permissions: {
        publish: {
          allow: ["tasks.p2", "results.>", "sup.>", "$JS.API.STREAM.INFO.*", "$JS.API.CONSUMER.INFO.TASKS.*",
                  "$JS.API.CONSUMER.MSG.NEXT.TASKS.*", "$JS.ACK.TASKS.>"]
          deny: ["tasks.p0", "tasks.p1"]
        }
        subscribe: ["_INBOX.>"]
      }
    }
  ]
}
