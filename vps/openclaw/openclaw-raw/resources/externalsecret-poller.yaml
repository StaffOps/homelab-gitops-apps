# Secret poller: NATS client of the poller sidecar (NATS_URL, NATS_USER, NATS_PASSWORD).
# Vault secret/homelab/apps/openclaw/poller (values written by the operator, never in git).
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: poller
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: SecretStore
          name: vault
      target:
          name: poller
          creationPolicy: Owner
      dataFrom:
          - extract:
                key: homelab/apps/openclaw/poller
