# Secret center-claw: token of the center collector (key token, mounted at /run/center/token).
# Vault secret/homelab/apps/openclaw/center-claw (values written by the operator, never in git).
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: center-claw
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: SecretStore
          name: vault
      target:
          name: center-claw
          creationPolicy: Owner
      dataFrom:
          - extract:
                key: homelab/apps/openclaw/center-claw
