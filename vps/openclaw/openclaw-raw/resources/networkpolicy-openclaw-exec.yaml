# Exec sandbox: ssh only from the openclaw pod (plus cni0 10.42.0.1 for the kubelet tcpSocket probe). Out: DNS and
# the internet, never the pod/service networks, private ranges or the tailnet (it cannot reach edge, NATS, Authelia).
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
      name: openclaw-exec
  spec:
      podSelector:
          matchLabels:
              app.kubernetes.io/instance: openclaw-exec
      policyTypes: [Ingress, Egress]
      ingress:
          - from:
                - podSelector:
                      matchLabels:
                          app.kubernetes.io/instance: openclaw
                - ipBlock:
                      cidr: {{ .Values.host.ip }}/32
            ports:
                - port: 2222
                  protocol: TCP
      egress:
          - to:
                - namespaceSelector:
                      matchLabels:
                          kubernetes.io/metadata.name: kube-system
            ports:
                - port: 53
                  protocol: UDP
                - port: 53
                  protocol: TCP
          - to:
                - ipBlock:
                      cidr: 0.0.0.0/0
                      except: [10.42.0.0/16, 10.43.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 192.168.0.0/16]
