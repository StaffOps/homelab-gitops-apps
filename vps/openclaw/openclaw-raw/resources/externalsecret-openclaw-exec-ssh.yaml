# Secret openclaw-exec-ssh: sshd of the sandbox (ssh_host_ed25519_key, ssh_host_ed25519_key.pub, authorized_keys).
# Vault secret/homelab/apps/openclaw/openclaw-exec-ssh (values written by the operator, never in git).
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: openclaw-exec-ssh
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: SecretStore
          name: vault
      target:
          name: openclaw-exec-ssh
          creationPolicy: Owner
      dataFrom:
          - extract:
                key: homelab/apps/openclaw/openclaw-exec-ssh
