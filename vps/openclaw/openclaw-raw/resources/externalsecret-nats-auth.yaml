# Secret nats-auth: secrets.conf of NATS (ADMIN_HASH, OWNER_HASH, HERMES_HASH, OPENCLAW_HASH bcrypt hashes), included by nats-server.conf.
# Vault secret/homelab/apps/openclaw/nats-auth (values written by the operator, never in git).
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: nats-auth
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: SecretStore
          name: vault
      target:
          name: nats-auth
          creationPolicy: Owner
      dataFrom:
          - extract:
                key: homelab/apps/openclaw/nats-auth
