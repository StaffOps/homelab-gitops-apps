# Secret openclaw: env of the gateway (OPENCLAW_GATEWAY_PASSWORD, OPENCLAW_LLM_API_KEY, A2A_HERMES_TOKEN, A2A_HERMES_OUTBOUND_TOKEN, OPENCLAW_HOOKS_TOKEN, OPENCLAW_TELEGRAM_BOT_TOKEN).
# Vault secret/homelab/apps/openclaw/openclaw (values written by the operator, never in git).
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: openclaw
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: SecretStore
          name: vault
      target:
          name: openclaw
          creationPolicy: Owner
      dataFrom:
          - extract:
                key: homelab/apps/openclaw/openclaw
