# Secret openclaw-ssh-client: SSH client of the sandbox (id_ed25519, id_ed25519.pub, known_hosts pinning openclaw-exec), mounted at /home/node/.ssh-sandbox.
# Vault secret/homelab/apps/openclaw/openclaw-ssh-client (values written by the operator, never in git).
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
      name: openclaw-ssh-client
  spec:
      refreshInterval: 1h
      secretStoreRef:
          kind: SecretStore
          name: vault
      target:
          name: openclaw-ssh-client
          creationPolicy: Owner
      dataFrom:
          - extract:
                key: homelab/apps/openclaw/openclaw-ssh-client
