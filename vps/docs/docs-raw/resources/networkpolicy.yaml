# hermes-docs: in 8080 only from Traefik (kube-system).
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
      name: hermes-docs
  spec:
      podSelector:
          matchLabels:
              app.kubernetes.io/instance: hermes-docs
      policyTypes: [Ingress]
      ingress:
          - from:
                - namespaceSelector:
                      matchLabels:
                          kubernetes.io/metadata.name: kube-system
                  podSelector:
                      matchLabels:
                          app.kubernetes.io/name: traefik
            ports:
                - port: 8080
                  protocol: TCP
