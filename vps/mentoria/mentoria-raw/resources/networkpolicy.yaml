# mentoria-portal: in 8080 only from Traefik (kube-system); no egress at all (static content, admin API off).
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
      name: mentoria-portal
  spec:
      podSelector:
          matchLabels:
              app.kubernetes.io/instance: mentoria-portal
      policyTypes: [Ingress, Egress]
      ingress:
          - from:
                - namespaceSelector:
                      matchLabels:
                          kubernetes.io/metadata.name: kube-system
                  podSelector:
                      matchLabels:
                          app.kubernetes.io/name: traefik
            ports:
                - port: 8080
                  protocol: TCP
      egress: []
