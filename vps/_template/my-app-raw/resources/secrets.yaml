# Secrets of this namespace: Vault secret/homelab/apps/<namespace>/<name> on k8s01, read over the tailnet through
# this namespace's own SecretStore (mount kubernetes-vps, role apps: only ServiceAccount vault-reader of a namespace
# labelled staffops.space/tier=apps, only its own path). Values are written by the operator, never in git.
- apiVersion: v1
  kind: ServiceAccount
  metadata:
      name: vault-reader
- apiVersion: external-secrets.io/v1
  kind: SecretStore
  metadata:
      name: vault
  spec:
      provider:
          vault:
              server: {{ .Values.vault.address }}
              path: secret
              version: v2
              auth:
                  kubernetes:
                      mountPath: {{ .Values.vault.authMount }}
                      role: apps
                      serviceAccountRef:
                          name: vault-reader
