# Self-hosted Renovate for this repository (config: renovate.json5). Runs every 30 minutes and on demand.
# PRs are opened with the workflow's GITHUB_TOKEN. Private ghcr images (PersonalAIgent, StaffOps) are read with the
# repository secret RENOVATE_GHCR_TOKEN: a classic PAT with only read:packages, from an account that can pull them.
name: renovate
on:
    schedule:
        - cron: "7,37 * * * *"
    workflow_dispatch:
        inputs:
            logLevel:
                description: Renovate log level
                default: info
                type: choice
                options: [info, debug]
permissions:
    contents: write
    pull-requests: write
    issues: write
concurrency:
    group: renovate
    cancel-in-progress: false
jobs:
    renovate:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  renovate-version: 44.199.2
              env:
                  LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
                  RENOVATE_REPOSITORIES: ${{ github.repository }}
                  RENOVATE_ONBOARDING: "false"
                  RENOVATE_REQUIRE_CONFIG: required
                  RENOVATE_PLATFORM_COMMIT: enabled
                  RENOVATE_HOST_RULES: >-
                      [{"matchHost": "ghcr.io", "hostType": "docker", "username": "renovate",
                      "password": "${{ secrets.RENOVATE_GHCR_TOKEN }}"}]
